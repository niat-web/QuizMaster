
services:
  db:
    image: mysql:8.4
    container_name: quizmaster-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quizmaster}
      MYSQL_USER: ${MYSQL_USER:-quizmaster}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    container_name: quizmaster-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-quizmaster}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-quizmaster}
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
