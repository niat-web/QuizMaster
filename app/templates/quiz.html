{% extends "base.html" %}
{% block title %}Quiz{% endblock %}
{% block body_attrs %}data-quiz-id="{{ quiz_id }}"{% endblock %}

{% block content %}
<h1 id="quiz-title">Loading...</h1>
<p id="message"></p>

<form id="start-form" class="card" hidden>
    <p id="quiz-description"></p>
    <label for="player-name">Your name</label>
    <input id="player-name" type="text" maxlength="30" required>
    <button type="submit">Start quiz</button>
</form>

<section id="question-box" class="card" hidden>
    <p id="progress"></p>
    <h2 id="question-text"></h2>
    <div id="options"></div>
    <div class="buttons">
        <button id="prev-button" type="button">Previous</button>
        <button id="next-button" type="button">Next</button>
        <button id="submit-button" type="button" hidden>Submit</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
