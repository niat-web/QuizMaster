{% extends "base.html" %}
{% block title %}Leaderboard{% endblock %}

{% block content %}
<h1>Leaderboard</h1>
<p id="message" role="status" aria-live="polite" ></p>

<label for="quiz-select">Quiz</label>
<select id="quiz-select"></select>

<table id="leaderboard-table">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Score</th>
            <th>Time (seconds)</th>
        </tr>
    </thead>
    <tbody id="leaderboard-body"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/leaderboard.js') }}"></script>
{% endblock %}
