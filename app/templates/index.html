{% extends "base.html" %}
{% block title %}Quizzes{% endblock %}

{% block content %}
<h1>Choose a quiz</h1>

<input id="search-input" type="text" placeholder="Search quizzes by title..." aria-label="Search quizzes">

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
